<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إشراف SHQAWA PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
        body { background:#0a0a0a; color:#fff; padding:20px; display:flex; justify-content:center; }
        .admin-card { background:#141414; border:2px solid #ff0000; border-radius:16px; padding:25px; width:100%; max-width:500px; box-shadow:0 0 25px rgba(255,0,0,0.3); }
        h1 { color:#ff0000; font-size:22px; text-align:center; margin-bottom:20px; }
        label { display:block; margin-bottom:6px; font-size:14px; color:#ccc; }
        input, select { width:100%; padding:12px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:15px; font-size:15px; }
        input:focus, select:focus { border-color:#ff0000; outline:none; }
        button { background:#ff0000; color:#fff; border:none; padding:14px; width:100%; border-radius:8px; font-weight:800; font-size:16px; cursor:pointer; }
        .back-link { display:block; text-align:center; color:#888; margin-top:15px; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>

<div class="admin-card">
    <h1>لوحة إضافة العمل الجديد</h1>
    
    <label>عنوان العمل أو التطبيق:</label>
    <input type="text" id="title" placeholder="مثلاً: تطبيق متجر إلكتروني">

    <label>رابط صورة المعاينة (Image URL):</label>
    <input type="text" id="image" placeholder="https://domain.com/image.jpg">

    <label>القسم:</label>
    <select id="category">
        <option value="websites">المواقع والمتاجر</option>
        <option value="apps">التطبيقات</option>
        <option value="bots">البوتات الذكية</option>
        <option value="designs">التصاميم والبنرات</option>
    </select>

    <button onclick="addProject()">تم والنشر فوراً 🚀</button>
    <a href="index.html" class="back-link">الرجوع للموقع الرئيسي</a>
</div>

<script>
    function addProject() {
        const title = document.getElementById('title').value;
        const image = document.getElementById('image').value;
        const category = document.getElementById('category').value;
        const categoryName = document.getElementById('category').options[document.getElementById('category').selectedIndex].text;

        if(!title || !image) {
            alert('برجاء كتابة جميع البيانات!');
            return;
        }

        const projects = JSON.parse(localStorage.getItem('shqawa_projects') || '[]');
        projects.push({ title, image, category, categoryName });
        localStorage.setItem('shqawa_projects', JSON.stringify(projects));

        alert('تم رفع العمل بنجاح ونشره في موقع العميل!');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
