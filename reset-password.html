<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تغيير كلمة المرور | شقاوة برو</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-body"><header class="site-header"><a class="brand" href="/"><span class="brand-art"><img src="/assets/shqawa-pro-logo.jpg" alt="SHQAWA PRO"></span></a><a class="back-link" href="/admin.html">← لوحة الإدارة</a></header>
<main class="admin-main"><section class="admin-card" style="max-width:480px;margin:50px auto"><h1>تغيير كلمة المرور</h1><p>اكتب كلمة مرور جديدة لحساب مدير شقاوة برو.</p><form id="resetForm"><label>كلمة المرور الجديدة<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="8 أحرف على الأقل"></label><label>تأكيد كلمة المرور<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="اكتبها مرة أخرى"></label><button class="btn btn-primary" type="submit" style="width:100%">حفظ كلمة المرور</button><p id="resetMessage" role="status" class="form-message"></p></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>
(async()=>{const cfg=window.SHQAWA_SUPABASE_CONFIG||{};const out=document.getElementById('resetMessage');const form=document.getElementById('resetForm');if(!window.supabase||!cfg.url||!cfg.publishableKey){out.textContent='إعداد Supabase غير مكتمل.';form.hidden=true;return}const db=window.supabase.createClient(cfg.url,cfg.publishableKey);const {data,error}=await db.auth.getSession();if(error||!data.session){out.textContent='الرابط غير صالح أو انتهت صلاحيته. ارجع إلى لوحة الإدارة واطلب رسالة جديدة.';form.hidden=true;return}form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a.length<8){out.textContent='كلمة المرور لازم تكون 8 أحرف على الأقل.';return}if(a!==b){out.textContent='كلمتا المرور غير متطابقتين.';return}const btn=form.querySelector('button');btn.disabled=true;const {error}=await db.auth.updateUser({password:a});btn.disabled=false;if(error){out.textContent='تعذر تغيير كلمة المرور: '+error.message;return}await db.auth.signOut();out.textContent='تم تغيير كلمة المرور بنجاح. افتح لوحة الإدارة وسجّل الدخول.';form.reset();});})();
</script><script src="/push-config.js"></script><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script><script src="/push.js" defer></script></body></html>
